<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HALO Search</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #overlay {
      width: 100%;
      height: 100%;
      background: #0d0d1a;
      border: 1px solid rgba(124, 106, 247, 0.25);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }

    #overlay.searching {
      border-color: rgba(124, 106, 247, 0.6);
      box-shadow: 0 0 30px rgba(124, 106, 247, 0.15);
    }

    /* ── Search Input ── */
    #search-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    #search-icon {
      font-size: 16px;
      opacity: 0.35;
      flex-shrink: 0;
      transition: opacity 200ms ease;
    }

    #overlay.searching #search-icon {
      opacity: 1;
    }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      font-family: inherit;
      font-weight: 400;
      caret-color: #7c6af7;
    }

    #search-input::placeholder {
      color: rgba(255,255,255,0.2);
    }

    #esc-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px;
      padding: 3px 8px;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 150ms ease;
      user-select: none;
    }

    #esc-hint:hover {
      border-color: rgba(239,68,68,0.5);
      color: #fca5a5;
      background: rgba(239,68,68,0.1);
    }

    /* ── Typing animation ── */
    @keyframes pulse-border {
      0%   { box-shadow: 0 0 0 0 rgba(124,106,247,0.4); }
      70%  { box-shadow: 0 0 0 6px rgba(124,106,247,0); }
      100% { box-shadow: 0 0 0 0 rgba(124,106,247,0); }
    }

    #overlay.searching {
      animation: none;
    }

    #search-input:focus {
      caret-color: #7c6af7;
    }

    /* ── Results ── */
    #results {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    #results::-webkit-scrollbar { width: 3px; }
    #results::-webkit-scrollbar-track { background: transparent; }
    #results::-webkit-scrollbar-thumb {
      background: rgba(124,106,247,0.3);
      border-radius: 2px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 11px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 100ms ease;
      border: 1px solid transparent;
    }

    .result-item:hover,
    .result-item.selected {
      background: rgba(124,106,247,0.12);
      border-color: rgba(124,106,247,0.25);
    }

    .result-file-icon {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .result-meta {
      flex: 1;
      min-width: 0;
    }

    .result-name {
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-folder {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-snippet {
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-snippet b {
      color: #a89ff9;
      font-weight: 600;
    }

    .ext-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 5px;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .ext-pdf   { background: rgba(239,68,68,0.2);   color: #fca5a5; }
    .ext-docx  { background: rgba(59,130,246,0.2);  color: #93c5fd; }
    .ext-pptx  { background: rgba(249,115,22,0.2);  color: #fdba74; }
    .ext-xlsx  { background: rgba(16,185,129,0.2);  color: #6ee7b7; }
    .ext-default { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }

    /* ── Empty state ── */
    #empty-state {
      padding: 40px 20px;
      text-align: center;
      line-height: 2;
    }

    .empty-shortcut {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,106,247,0.1);
      border: 1px solid rgba(124,106,247,0.25);
      border-radius: 8px;
      padding: 4px 12px;
      color: rgba(124,106,247,0.8);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-weight: 500;
    }

    .empty-types {
      font-size: 12px;
      color: rgba(255,255,255,0.18);
      margin-top: 4px;
    }

    /* ── Footer ── */
    #footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    #footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
    }

    #footer-left span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #stat-time {
      color: #6ee7b7 !important;
      font-weight: 500;
    }

    /* Coverage breakdown */
    #coverage {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
    }

    .cov-item {
      display: flex;
      align-items: center;
      gap: 3px;
      color: rgba(255,255,255,0.25);
    }

    .cov-item .cov-count {
      font-weight: 600;
      color: rgba(255,255,255,0.45);
    }

    #footer-right {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: rgba(255,255,255,0.18);
    }

    .kbd {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
    }

    /* ── Search meta bar ── */
    #search-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 18px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    #stat-time-bar {
      font-size: 11px;
      color: #6ee7b7;
      font-weight: 500;
    }

    /* ── Settings button ── */
    #settings-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 150ms ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #settings-btn:hover {
      border-color: rgba(124,106,247,0.4);
      color: #a89ff9;
      box-shadow: 0 0 8px rgba(124,106,247,0.15);
    }

</head>
<body>
  <div id="overlay">

    <div id="search-wrap">
      <span id="search-icon">🔍</span>
      <input
        id="search-input"
        type="text"
        placeholder="Search PDFs, DOCX, XLSX, notes..."
        autocomplete="off"
        autofocus
      />
      <span id="esc-hint">esc</span>
    </div>

    <div id="search-meta" style="display:none">
      <span id="stat-time-bar"></span>
    </div>

    <div id="results">
      <div id="empty-state">
        <div class="empty-shortcut">⌥ Space</div>
        <div class="empty-title">Search across your indexed files</div>
        <div class="empty-types">PDFs · DOCX · PPTX · XLSX · Text · Code</div>
      </div>
    </div>

    <div id="footer">
      <div id="footer-left">
        <div id="coverage">
          <span class="cov-item">📄 <span class="cov-count" id="cov-pdf">—</span> PDF</span>
          <span style="color:rgba(255,255,255,0.1)">·</span>
          <span class="cov-item">📝 <span class="cov-count" id="cov-docx">—</span> DOCX</span>
          <span style="color:rgba(255,255,255,0.1)">·</span>
          <span class="cov-item">📊 <span class="cov-count" id="cov-xlsx">—</span> XLSX</span>
          <span style="color:rgba(255,255,255,0.1)">·</span>
          <span class="cov-item">📽 <span class="cov-count" id="cov-pptx">—</span> PPTX</span>
          <span style="color:rgba(255,255,255,0.1)">·</span>
          <span class="cov-item">📃 <span class="cov-count" id="cov-text">—</span> Text</span>
        </div>
        <span id="stat-time" style="display:none"></span>
      </div>
      <div id="footer-right">
        <button id="settings-btn">⚙️ Settings</button>
        <span class="kbd">↑↓</span>
        <span class="kbd">↵</span> open
        <span class="kbd">esc</span> close
      </div>
    </div>

  </div>
  <script type="module" src="/src/overlay.ts"></script>
</body>
