[package]
name = "halo"
version = "0.0.1"
description = "HALO — Give every folder an identity."
authors = ["Sharique"]
edition = "2021"

[lib]
name = "halo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
