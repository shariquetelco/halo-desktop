<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HALO</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <!-- App Shell -->
    <div id="app">

      <!-- Header -->
      <header id="header">
        <span id="header-logo">🌟</span>
        <span id="header-title">HALO</span>
        <span id="header-tagline">Give every folder an identity.</span>
      </header>

      <!-- Main Layout -->
      <div id="layout">

        <!-- Sidebar -->
        <aside id="sidebar">

          <!-- Add Folder Button -->
          <button id="add-folder-btn">+ Add Folder</button>

          <!-- Folder List -->
          <div id="folder-list">
            <p id="folder-list-empty">No folders added yet.</p>
          </div>

        </aside>

        <!-- Workspace -->
        <main id="workspace">

          <!-- Atmosphere Layer -->
          <div id="identity-atmosphere"></div>

          <!-- Empty State -->
          <div id="empty-state">
            <div id="empty-icon">📁</div>
            <h2 id="empty-title">Give your first folder an identity.</h2>
            <p id="empty-subtitle">Click "Add Folder" to get started.</p>
          </div>

          <!-- Folder Identity View -->
          <div id="identity-view" class="hidden">
            <div id="identity-content">

              <!-- Folder Header -->
              <div id="identity-header">
                <div id="identity-icon-wrapper">
                  <span id="identity-icon">📁</span>
                </div>
                <div id="identity-titles">
                  <h1 id="identity-name">Folder Name</h1>
                  <p id="identity-category">Category</p>
                </div>
              </div>

              <!-- Folder Description -->
              <div id="identity-description">
                <p id="description-text">No description yet.</p>
                <button id="add-description-btn">+ Add Description</button>
              </div>

              <!-- Folder Stats -->
              <div id="identity-stats">
                <div class="stat">
                  <span class="stat-label">Files</span>
                  <span class="stat-value" id="stat-files">—</span>
                </div>
                <div class="stat">
                  <span class="stat-label">Folders</span>
                  <span class="stat-value" id="stat-folders">—</span>
                </div>
                <div class="stat">
                  <span class="stat-label">Last Modified</span>
                  <span class="stat-value" id="stat-modified">—</span>
                </div>
              </div>

              <!-- Identity Controls -->
              <div id="identity-controls">
                <button class="control-btn" id="change-icon-btn">Change Icon</button>
                <button class="control-btn" id="change-color-btn">Change Color</button>
              </div>

            </div>
          </div>

        </main>

      </div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
